name: Release

# 推送 v* 标签时构建并发布安装包；手动运行（workflow_dispatch）只构建并上传 artifact，不创建 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Yarn
        run: npm install --global yarn@1.22.22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      # 如需 Apple 签名/公证：在仓库 Secrets 配置证书，然后在下面两个构建步骤的 env 中补上
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID。

      - name: Build and publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LogScope ${{ github.ref_name }}
          releaseBody: |
            LogScope 客户端安装包。

            - macOS：universal（Apple Silicon + Intel）`.dmg`，未签名。首次打开若被 Gatekeeper 拦截：
              右键「打开」，或执行 `xattr -dr com.apple.quarantine /Applications/LogScope.app`。
            - Windows：`.msi` 与 NSIS `.exe`，未签名，SmartScreen 提示时选择「仍要运行」。

            变更说明见提交历史；详细设计见 docs/PROJECT_CONTEXT.md。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build installers without publishing
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload installers as artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LogScope-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
