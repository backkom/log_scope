[package]
name = "log_scope"
version = "0.1.0"
description = "A high-performance readonly log viewer."
authors = ["log_scope contributors"]
edition = "2021"

[lib]
name = "log_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
