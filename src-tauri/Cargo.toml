[package]
name = "log_scope"
version = "0.1.1"
description = "A high-performance readonly log viewer."
authors = ["log_scope contributors"]
edition = "2021"

[[bin]]
name = "LogScope"
path = "src/main.rs"

[lib]
name = "log_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
